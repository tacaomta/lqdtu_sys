{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <form method="POST" novalidate>

        {% csrf_token %}

        <div class="row justify-content-center">

            


            <div class="col-md-6 col-lg-5">
                <h5 style="text-align: center;">
                    {% if edit_mode %}

                        CẬP NHẬT NGƯỜI DÙNG

                    {% else %}

                        TẠO NGƯỜI DÙNG MỚI

                    {% endif %}
                </h5>
                {% if messages %}

                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'success' %}success{% else %}info{% endif %} alert-dismissible fade show">

                            {{ message }}

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                            </button>

                        </div>

                    {% endfor %}

                {% endif %}

                <!-- LOGIN CARD -->

                <div class="card shadow-sm mb-3">

                    <div class="card-header bg-white">

                        <h5 class="mb-0">

                            Thông tin đăng nhập

                        </h5>

                    </div>

                    <div class="card-body">

                        <div class="mb-3">

                            <label class="form-label">

                                Username *

                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                value="{{ edit_user.username }}" {% if edit_mode %} readonly {% endif %}
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control" value="{{ edit_user.email }}"
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Password *

                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control" {% if edit_mode %} placeholder="Để trống nếu không đổi" {% endif %}
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Vai trò

                            </label>

                            <select
                                name="role_id"
                                class="form-select" multiple
                            >

                                <option value="">

                                    ---------

                                </option>

                                {% for role in roles %}

                                <option value="{{ role.id }}" {% if role.id in selected_role_ids %} selected {% endif %}>

                                    {{ role.name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                    </div>

                </div>

                <!-- PROFILE CARD -->

                <div class="card shadow-sm">

                    <div class="card-header bg-white">

                        <h5 class="mb-0">

                            Thông tin cá nhân

                        </h5>

                    </div>

                    <div class="card-body">

                        <div class="mb-3">

                            <label class="form-label">

                                Full Name

                            </label>

                            <input
                                type="text"
                                name="fullname"
                                class="form-control" value="{{ profile.fullname }}"
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Department

                            </label>

                            <select

                                name="department_id"

                                class="form-select"

                            >

                                <option value="">

                                    ---------

                                </option>

                                {% for department in departments %}

                                <option value="{{ department.id }}" {% if profile.department_id == department.id %}selected{% endif %}>

                                    {{ department.name }} 

                                </option>

                                {% endfor %}

                            </select>

                        </div>            
                    </div>

                </div>

                <!-- BUTTON -->

                <div class="mt-3 text-end">

                    <a
                        href="{% url 'user_list' %}"
                        class="btn btn-info"
                    >

                        Quay lại

                    </a>
                    <button
                        type="submit"
                        class="btn btn-primary"
                    >

                        <i class="bi bi-save"></i>

                        Lưu

                    </button>

                    

                </div>

            </div>

        </div>

    </form>

</div>

{% endblock %}
