{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-4">

    <div class="row justify-content-center">

        <div class="col-xl-8">

            <div class="card shadow-sm mb-4">

                <div class="card-header">

                    <h5 class="mb-0">

                        Liên kết hồ sơ tác giả

                    </h5>

                </div>

                <div class="card-body">

                    <div class="mb-3">

                        <label class="form-label">

                            Tác giả

                        </label>

                        <select
                            id="authorSelect"
                        ></select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Công bố minh chứng

                        </label>

                        <select
                            id="publicationSelect"
                            multiple
                        ></select>

                    </div>

                    <button
                        id="submitLinkRequestBtn"
                        class="btn btn-primary"
                    >

                        Gửi yêu cầu

                    </button>

                </div>

            </div>
            <div class="card shadow-sm">

                <div class="card-header">

                    <h5 class="mb-0">

                        Yêu cầu đã gửi

                    </h5>

                </div>

                <div class="card-body">

                    <table
                        class="table table-bordered"
                    >

                        <thead>

                            <tr>

                                <th>

                                    Tác giả

                                </th>

                                <th>

                                    Status

                                </th>

                                <th>

                                    Ngày gửi

                                </th>

                            </tr>

                        </thead>

                        <tbody>

                            {% for request in requests %}

                            <tr>

                                <td>

                                    {{ request.author.name }}

                                </td>

                                <td>

                                    {{ request.status }}

                                </td>

                                <td>

                                    {{ request.created_at|date:"d/m/Y H:i" }}

                                </td>

                            </tr>

                            {% endfor %}

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
