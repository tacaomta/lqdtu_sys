<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>

        Đăng nhập

    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        body {

            background-color: #f5f7fa;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .login-wrapper {

            width: 100%;

            max-width: 600px;

            padding: 20px;
        }

        .system-title {

            text-align: center;

            margin-bottom: 25px;
        }

        .system-title h2 {

            font-weight: 700;
        }

        .system-title p {

            color: #6c757d;

            margin-bottom: 0;
        }

        .login-card {

            border: none;

            border-radius: 12px;

            box-shadow: 0 4px 16px rgba(
                0,
                0,
                0,
                0.08
            );
        }

        .login-card .card-body {

            padding: 30px;
        }

        .btn-login {

            width: 100%;
        }

        .footer-links {

            text-align: center;

            margin-top: 20px;
        }

    </style>

</head>

<body>

    <div class="login-wrapper">

        <div class="system-title">

            <h2>

                Trường Đại học Kỹ thuật Lê Quý Đôn

            </h2>

            <p>

                Hệ thống thu thập, lưu trữ, phân tích CBKH thuộc CSDL WoS/Scopus

            </p>

        </div>

        <div class="card login-card">

            <div class="card-body">

                <h4 class="text-center mb-4">

                    Đăng nhập

                </h4>

                {% if error %}

                    <div class="alert alert-danger">

                        {{ error }}

                    </div>

                {% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">

                            Tên đăng nhập

                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Mật khẩu

                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary btn-login"
                    >

                        <i class="bi bi-box-arrow-in-right"></i>

                        Đăng nhập

                    </button>

                </form>

                <div class="footer-links">

                    Chưa có tài khoản?

                    <a href="{% url 'register' %}">

                        Đăng ký

                    </a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
