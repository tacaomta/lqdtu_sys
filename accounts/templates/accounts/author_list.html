{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow-sm">
        <div class="card-header">

            <i class="bi bi-person-vcard-fill me-2"></i>

            Danh mục tác giả

        </div>

        <div class="card-body">
            <div class="row mb-3">

                <div class="col-md-4">

                    <input

                        type="text"

                        id="keyword"

                        class="form-control"

                        placeholder="Tên tác giả, trường hoặc quốc gia"

                    >

                </div>
                <div class="col-md-2">

                        <select

                            id="pageSize"

                            class="form-select"

                        >

                            <option value="10">10</option>

                            <option value="20" selected>20</option>

                            <option value="30">30</option>

                            <option value="50">50</option>

                        </select>

                </div>

            </div>
            <table
                class="table table-bordered table-hover"
            >

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Tác giả</th>

                        <th>Trường</th>

                        <th>Quốc gia</th>

                    </tr>

                </thead>

                <tbody

                    id="authorTableBody"

                >

                </tbody>

            </table>
            <div class="d-flex justify-content-between align-items-center">

                <div class="text-muted small" id="summary">

                </div>

            </div>

            <nav>

                <ul

                    id="pagination"

                    class="pagination"

                >

                </ul>

            </nav>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'accounts/js/author_list.js' %}"></script>
{% endblock %}
